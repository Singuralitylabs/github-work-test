<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git 超入門</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: #f0f4f8;
      color: #333;
      line-height: 1.7;
    }

    header {
      background: #f05033;
      color: white;
      padding: 48px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    main {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      border-radius: 10px;
      padding: 32px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 1.4rem;
      color: #f05033;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #fde8e4;
    }

    p {
      margin-bottom: 12px;
    }

    .step-list {
      list-style: none;
      counter-reset: step;
    }

    .step-list li {
      counter-increment: step;
      padding: 12px 16px 12px 52px;
      margin-bottom: 10px;
      background: #f9f9f9;
      border-radius: 8px;
      position: relative;
    }

    .step-list li::before {
      content: counter(step);
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: #f05033;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .command-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .command-card {
      background: #f9f9f9;
      border-left: 4px solid #f05033;
      border-radius: 6px;
      padding: 14px 16px;
    }

    .command-card code {
      display: block;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      background: #2d2d2d;
      color: #f8c291;
      padding: 6px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .command-card p {
      font-size: 0.9rem;
      color: #555;
      margin: 0;
    }

    .flow {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .flow-box {
      background: #fff3f0;
      border: 2px solid #f05033;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
    }

    .flow-arrow {
      font-size: 1.3rem;
      color: #f05033;
    }

    .tip {
      background: #fff8e1;
      border-left: 4px solid #ffc107;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 32px 16px;
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="glow" id="glow"></div>
<canvas id="c"></canvas>

<main>
  <span class="badge">&#9679; Now live — v2.0</span>

  <h1>
    <span class="word"><span>Build the</span></span>
    <br>
    <span class="word word2"><span>Impossible.</span></span>
  </h1>

  <p class="sub">
    次世代のクリエイターへ。アイデアを瞬時に形にする、
    まったく新しいプラットフォームが誕生しました。
  </p>

  <div class="cta">
    <a class="btn btn-primary" href="#">今すぐ始める</a>
    <a class="btn btn-ghost" href="#">詳細を見る →</a>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-icon">⚡</div>
      <h3>Lightning Fast</h3>
      <p>あらゆる処理をリアルタイムで。待ち時間ゼロの体験。</p>
    </div>
    <div class="card">
      <div class="card-icon">🔒</div>
      <h3>Secure by Default</h3>
      <p>エンドツーエンド暗号化。あなたのデータを守り続ける。</p>
    </div>
    <div class="card">
      <div class="card-icon">🌐</div>
      <h3>Global Edge</h3>
      <p>世界中のエッジから配信。どこにいても最速の接続。</p>
    </div>
    <div class="card">
      <div class="card-icon">🎨</div>
      <h3>Fully Customizable</h3>
      <p>あなたのブランドに合わせて、完全にカスタマイズ可能。</p>
    </div>
  </div>
</main>

<script>
  // --- Cursor glow ---
  const glow = document.getElementById('glow');
  window.addEventListener('mousemove', e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top  = e.clientY + 'px';
  });

  // --- Particle canvas ---
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initParticles(n = 120) {
    particles = Array.from({ length: n }, () => ({
      x:  Math.random() * W,
      y:  Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r:  Math.random() * 1.5 + 0.5,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(124,58,237,${(1 - d / 120) * 0.35})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    // dots
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168,85,247,0.7)';
      ctx.fill();

      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  resize();
  initParticles();
  draw();
</script>
</body>
</html>
