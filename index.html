<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOID</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #050508;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- Canvas background --- */
    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.6;
    }

    /* --- Main layout --- */
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    /* --- Glowing badge --- */
    .badge {
      display: inline-block;
      padding: 0.3rem 1rem;
      border: 1px solid rgba(124, 58, 237, 0.5);
      border-radius: 999px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent2);
      background: rgba(6, 182, 212, 0.06);
      margin-bottom: 2rem;
      animation: fadeDown 0.8s ease both;
    }

    /* --- Hero headline --- */
    h1 {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      animation: fadeDown 0.9s ease both 0.1s;
    }

    h1 .word {
      display: inline-block;
    }

    h1 .word span {
      display: inline-block;
      background: linear-gradient(135deg, #fff 30%, var(--accent2) 70%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 .word2 span {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* --- Sub headline --- */
    p.sub {
      margin-top: 1.5rem;
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.7;
      animation: fadeDown 1s ease both 0.2s;
    }

    /* --- CTA buttons --- */
    .cta {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeDown 1s ease both 0.35s;
    }

    .btn {
      padding: 0.8rem 2rem;
      border-radius: 0.6rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      display: inline-block;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      box-shadow: 0 0 24px rgba(124, 58, 237, 0.45);
    }
    .btn-primary:hover { box-shadow: 0 0 40px rgba(124, 58, 237, 0.7); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.04); }

    /* --- Feature cards --- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-top: 5rem;
      width: 100%;
      max-width: 800px;
      animation: fadeDown 1s ease both 0.5s;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: left;
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
    }
    .card:hover {
      background: rgba(124, 58, 237, 0.07);
      border-color: rgba(124, 58, 237, 0.35);
      transform: translateY(-4px);
    }

    .card-icon {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .card h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .card p {
      font-size: 0.82rem;
      color: #64748b;
      line-height: 1.6;
    }

    /* --- Cursor glow --- */
    .glow {
      position: fixed;
      pointer-events: none;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      z-index: 0;
    }

    /* --- Animations --- */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="glow" id="glow"></div>
<canvas id="c"></canvas>

<main>
  <span class="badge">&#9679; Now live — v2.0</span>

  <h1>
    <span class="word"><span>Build the</span></span>
    <br>
    <span class="word word2"><span>Impossible.</span></span>
  </h1>

  <p class="sub">
    次世代のクリエイターへ。アイデアを瞬時に形にする、
    まったく新しいプラットフォームが誕生しました。
  </p>

  <div class="cta">
    <a class="btn btn-primary" href="#">今すぐ始める</a>
    <a class="btn btn-ghost" href="#">詳細を見る →</a>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-icon">⚡</div>
      <h3>Lightning Fast</h3>
      <p>あらゆる処理をリアルタイムで。待ち時間ゼロの体験。</p>
    </div>
    <div class="card">
      <div class="card-icon">🔒</div>
      <h3>Secure by Default</h3>
      <p>エンドツーエンド暗号化。あなたのデータを守り続ける。</p>
    </div>
    <div class="card">
      <div class="card-icon">🌐</div>
      <h3>Global Edge</h3>
      <p>世界中のエッジから配信。どこにいても最速の接続。</p>
    </div>
    <div class="card">
      <div class="card-icon">🎨</div>
      <h3>Fully Customizable</h3>
      <p>あなたのブランドに合わせて、完全にカスタマイズ可能。</p>
    </div>
  </div>
</main>

<script>
  // --- Cursor glow ---
  const glow = document.getElementById('glow');
  window.addEventListener('mousemove', e => {
    glow.style.left = e.clientX + 'px';
    glow.style.top  = e.clientY + 'px';
  });

  // --- Particle canvas ---
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, particles;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function initParticles(n = 120) {
    particles = Array.from({ length: n }, () => ({
      x:  Math.random() * W,
      y:  Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r:  Math.random() * 1.5 + 0.5,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // connections
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `rgba(124,58,237,${(1 - d / 120) * 0.35})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }

    // dots
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(168,85,247,0.7)';
      ctx.fill();

      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  resize();
  initParticles();
  draw();
</script>
</body>
</html>
